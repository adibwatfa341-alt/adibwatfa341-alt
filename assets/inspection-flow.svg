<radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2ed8ff" stop-opacity=".22"/><stop offset="1" stop-color="#2ed8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8c7cff" stop-opacity=".26"/><stop offset="1" stop-color="#8c7cff" stop-opacity="0"/></radialGradient>
