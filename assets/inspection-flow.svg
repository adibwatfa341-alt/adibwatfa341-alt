.vt{font:600 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;fill:#94a3b8}.vl{font:500 12px Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace;fill:#94a3b8;animation:pop .4s ease both}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><rect width="1000" height="395" rx="20" fill="#06090f"/><rect width="1000" height="395" rx="20" fill="url(#dots)"/><rect x=".5" y=".5" width="999" height="394" rx="20" fill="none" stroke="rgba(255,255,255,0.09)"/><text x="28" y="36" class="kick">02 · ZERO-SHOT TOOL INSPECTION · NVIDIA DGX SPARK</text><text x="28" y="62" class="ttl">One photo → a verdict for every tool</text><rect x="402" y="78" width="392" height="220" rx="16" class="zone"/><text x="414" y="289" class="zl">LOCAL INFERENCE ON DGX SPARK</text><path d="M192,121.0 L218,121.0" class="ep"/><path id="inspection-flowe0" d="M192,121.0 L218,121.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite"><mpath href="#inspection-flowe0"/></animateMotion></circle><path d="M386,121.0 L412,121.0" class="ep"/><path id="inspection-flowe1" d="M386,121.0 L412,121.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="0.33s" repeatCount="indefinite"><mpath href="#inspection-flowe1"/></animateMotion></circle><path d="M580,121.0 L606,121.0" class="ep"/><path id="inspection-flowe2" d="M580,121.0 L606,121.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="0.66s" repeatCount="indefinite"><mpath href="#inspection-flowe2"/></animateMotion></circle><path d="M774,121.0 L800,121.0" class="ep"/><path id="inspection-flowe3" d="M774,121.0 L800,121.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="0.99s" repeatCount="indefinite"><mpath href="#inspection-flowe3"/></animateMotion></circle><path d="M884.0,150 L884.0,212" class="ep"/><path id="inspection-flowe4" d="M884.0,150 L884.0,212" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="1.32s" repeatCount="indefinite"><mpath href="#inspection-flowe4"/></animateMotion></circle><path d="M800,241.0 L774,241.0" class="ep"/><path id="inspection-flowe5" d="M800,241.0 L774,241.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="1.65s" repeatCount="indefinite"><mpath href="#inspection-flowe5"/></animateMotion></circle><path d="M606,241.0 L580,241.0" class="ep"/><path id="inspection-flowe6" d="M606,241.0 L580,241.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="1.98s" repeatCount="indefinite"><mpath href="#inspection-flowe6"/></animateMotion></circle><path d="M412,241.0 L386,241.0" class="ep"/><path id="inspection-flowe7" d="M412,241.0 L386,241.0" class="ef"/><circle r="3.6" class="pl"><animateMotion dur="2.4s" begin="2.31s" repeatCount="indefinite"><mpath href="#inspection-flowe7"/></animateMotion></circle><path d="M218,241.0 L192,241.0" class="ep"/><path id="inspection-flowe8" d="M218,241.0 L192,241.0" class="ed"/><g class="ng" style="animation-delay:0.00s"><rect x="24" y="92" width="168" height="58" rx="12" class="nb"/><text x="38" y="118" class="nl">Field photo</text><text x="38" y="136" class="ns">web app or /api/v1</text></g><g class="ng" style="animation-delay:0.08s"><rect x="218" y="92" width="168" height="58" rx="12" class="nb"/><text x="232" y="118" class="nl">FastAPI + Celery</text><text x="232" y="136" class="ns">jobs · API keys</text></g><g class="ng" style="animation-delay:0.16s"><rect x="412" y="92" width="168" height="58" rx="12" class="nb ai"/><text x="570" y="107" class="tag">AI</text><text x="426" y="118" class="nl">SAM 3</text><text x="426" y="136" class="ns">one mask per tool</text></g><g class="ng" style="animation-delay:0.24s"><rect x="606" y="92" width="168" height="58" rx="12" class="nb ai"/><text x="764" y="107" class="tag">AI</text><text x="620" y="118" class="nl">AnomalyCLIP</text><text x="620" y="136" class="ns">zero-shot heatmap</text></g><g class="ng" style="animation-delay:0.32s"><rect x="800" y="92" width="168" height="58" rx="12" class="nb"/><text x="814" y="118" class="nl">Calibration</text><text x="814" y="136" class="ns">median + k·MAD</text></g><g class="ng" style="animation-delay:0.40s"><rect x="800" y="212" width="168" height="58" rx="12" class="nb"/><text x="814" y="238" class="nl">Shape checks</text><text x="814" y="256" class="ns">bend · missing · width</text></g><g class="ng" style="animation-delay:0.48s"><rect x="606" y="212" width="168" height="58" rx="12" class="nb ai"/><text x="764" y="227" class="tag">AI</text><text x="620" y="238" class="nl">Qwen3-VL-8B judge</text><text x="620" y="256" class="ns">rules per tool type</text></g><g class="ng" style="animation-delay:0.56s"><rect x="412" y="212" width="168" height="58" rx="12" class="nb"/><text x="426" y="238" class="nl">Verdict</text><text x="426" y="256" class="ns">one of 4 verdicts</text></g><g class="ng" style="animation-delay:0.64s"><rect x="218" y="212" width="168" height="58" rx="12" class="nb"/><text x="232" y="238" class="nl">React UI · AR/EN</text><text x="232" y="256" class="ns">+ Odoo team API</text></g><g class="ng" style="animation-delay:0.72s"><rect x="24" y="212" width="168" height="58" rx="12" class="nb mu"/><text x="38" y="238" class="nl">PostgreSQL</text><text x="38" y="256" class="ns">run history</text></g><text x="24" y="328" class="vt">One worksite photo · 26 tools judged</text><rect x="24.0" y="340" width="0" height="14" rx="4" fill="#34d399"><animate attributeName="width" begin="0.60s" dur="0.8s" fill="freeze" values="0;436.4" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="26.0" y="374" class="vl" style="animation-delay:0.90s">12 fit</text><rect x="463.4" y="340" width="0" height="14" rx="4" fill="#fbbf24"><animate attributeName="width" begin="0.95s" dur="0.8s" fill="freeze" values="0;216.7" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="465.4" y="374" class="vl" style="animation-delay:1.25s">6 inspect</text><rect x="683.1" y="340" width="0" height="14" rx="4" fill="#f87171"><animate attributeName="width" begin="1.30s" dur="0.8s" fill="freeze" values="0;143.5" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="685.1" y="374" class="vl" style="animation-delay:1.60s">4 remove</text><rect x="829.5" y="340" width="0" height="14" rx="4" fill="#94a3b8"><animate attributeName="width" begin="1.65s" dur="0.8s" fill="freeze" values="0;143.5" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect><text x="831.5" y="374" class="vl" style="animation-delay:1.95s">4 retake</text></svg>